<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabara Vertriebsportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0f; --panel:#11131a; --panel-2:#171a23; --line:#242836; --line-2:#2f3445;
  --text:#e8eaf0; --muted:#8a90a2; --dim:#5d6375;
  --accent:#3b82f6; --accent-2:#2563eb; --accent-soft:rgba(59,130,246,.14);
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:260px minmax(360px,440px) 1fr;height:100vh}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.editor{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.preview{display:flex;flex-direction:column;min-height:0;min-width:0}

/* ---------- Sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#1e3a8a);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;font-size:13px;letter-spacing:.06em}
.brand small{color:var(--muted);font-size:11px}
.side-actions{padding:0 12px 10px;display:flex;gap:8px}
.search{padding:0 12px 8px}
.search input,.search select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.search select{margin-top:6px}
.search input:focus,.search select:focus{border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:9px 10px;margin-bottom:2px}
.item:hover{background:var(--panel-2)}
.item.active{background:var(--accent-soft);border-color:rgba(59,130,246,.35)}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:11.5px;margin-top:2px}
.empty-list{color:var(--dim);font-size:12.5px;padding:14px 10px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.st-neu i{background:#94a3b8}.st-demo i{background:#a78bfa}.st-angebot i{background:var(--warn)}.st-gewonnen i{background:var(--ok)}.st-verloren i{background:var(--err)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#1f2330;border-color:#3a4054}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.danger:hover{border-color:var(--err);color:#fca5a5}
.btn.win{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#86efac}
.btn.win:hover{background:rgba(34,197,94,.24);border-color:#22c55e}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Editor ---------- */
.ed-head{position:sticky;top:0;z-index:5;background:rgba(10,11,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:8px}
.ed-head h2{margin:0;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checks{padding:10px 18px 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.chip.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#86efac}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(45deg)}
details.sec>summary .num{width:20px;height:20px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.fields{padding:0 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:11.5px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
.f textarea{resize:vertical;min-height:70px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=color]{padding:3px;height:36px;cursor:pointer}
.hint{font-size:11px;color:var(--dim)}
.cb{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:3px 0;cursor:pointer}
.cb input{margin-top:3px;accent-color:var(--accent)}
.cb .p{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbtn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn.inkl{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#86efac}
.drop{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop:focus-visible,.drop.over{border-color:var(--accent);background:var(--accent-soft);outline:none}
.drop img{width:74px;height:50px;object-fit:cover;border-radius:7px;background:#fff;flex:none}
.drop .ph{width:74px;height:50px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.drop .dtxt{min-width:0;flex:1}
.drop .dtxt b{display:block;font-size:12.5px;font-weight:600}
.drop .dtxt span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop button{flex:none;padding:4px 8px}
.drop.onlight img{background:#fff;padding:3px}
.tm{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tm .tmimg{width:56px;height:56px;padding:0;flex:none;justify-content:center;border-radius:10px;overflow:hidden}
.tm .tmimg img{width:56px;height:56px;border-radius:0}
.tm .tmimg .ph{width:56px;height:56px;border-radius:0}
.tm .tmf{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.tm .tmf input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none}
.tm .tmf input:focus{border-color:var(--accent)}
.drop img[src$="svg+xml"]{background:#fff}
.brand .blogo{max-width:164px;max-height:56px;width:auto;object-fit:contain}
.brand .bsub{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.brand{flex-wrap:wrap}
input[type=range]{accent-color:var(--accent);padding:0;background:none;border:0}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pkg{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 8px;text-align:left}
.pkg b{display:block;font-size:12.5px}
.pkg span{font-size:12px;color:var(--muted)}
.pkg.on{border-color:var(--accent);background:var(--accent-soft)}
.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.total b{font-size:16px}
.welcome{padding:48px 28px;text-align:center;color:var(--muted)}
.welcome h2{color:var(--text);font-size:18px;margin:0 0 8px}
.welcome ol{text-align:left;max-width:300px;margin:18px auto;padding-left:18px;line-height:1.9}

/* ---------- Preview ---------- */
.pv-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{background:none;border:0;border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.tab.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:6px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--text)}
.stage{flex:1;min-height:0;background:#06070a;display:flex;justify-content:center;overflow:auto;position:relative}
.frame-wrap{width:100%;height:100%;transition:width .2s}
.frame-wrap.mobile{width:390px;padding:16px 0}
.frame-wrap.mobile iframe{border-radius:18px;border:1px solid var(--line-2)}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.mails{width:100%;max-width:820px;padding:20px;overflow-y:auto}
.mail{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.mail-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mail-h b{font-size:13px}
.mail-h .when{font-size:11.5px;color:var(--muted)}
.mail-b{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mail-b input,.mail-b textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.mail-b textarea{min-height:230px;resize:vertical;line-height:1.55}
.mail-b input:focus,.mail-b textarea:focus{border-color:var(--accent)}
.no-cust{margin:auto;color:var(--dim);text-align:center;padding:30px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.modal.open{display:flex}
.dialog{background:var(--bg);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:720px}
.dialog-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dialog-h h3{margin:0;font-size:15px;flex:1}
.dialog .fields{padding-top:14px}
.dialog h4{grid-column:1/-1;margin:10px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}

/* ---------- Provision ---------- */
.prov{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.prov-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit}
.prov-head .k{font-size:11px;color:var(--muted)}
.prov-head b{font-size:16px;color:#86efac;font-variant-numeric:tabular-nums}
.prov-head:hover .k{color:var(--text)}
.prov-sub{font-size:11px;color:var(--muted);line-height:1.45}
.prov-sub b{color:var(--text)}.up{color:#86efac}
.bar{position:relative;height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:visible}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#22c55e);transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar-tick{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-tick i{width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--line-2);display:block}
.bar-tick.on i{background:#22c55e;border-color:#166534}
.bar.big{height:12px;margin:26px 0 30px}
.bar.big .bar-tick i{width:14px;height:14px}
.bar.big .bar-tick b{position:absolute;top:16px;font-size:11px;color:var(--muted);white-space:nowrap}
.bar.big .bar-tick.on b{color:#86efac}
.ck{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.ck-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ck-top select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:inherit}
.ck-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ck-tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ck-tile span{display:block;font-size:11px;color:var(--muted)}
.ck-tile b{font-size:20px;font-variant-numeric:tabular-nums}
.ck-tile.hi{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.35)}.ck-tile.hi b{color:#86efac}
.ck-next{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}.ck-next b{color:var(--text)}
.ck-h{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.ck-table{width:100%;border-collapse:collapse;font-size:13px}
.ck-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:0 0 6px;border-bottom:1px solid var(--line)}
.ck-table td{padding:8px 0;border-bottom:1px solid var(--line)}
.ck-table .r,.ck-table th.r{text-align:right;font-variant-numeric:tabular-nums;padding-left:12px}
.role{font-size:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:1px 6px;color:var(--muted)}
@media(max-width:600px){.ck-grid{grid-template-columns:1fr 1fr}}
/* ---------- Login ---------- */
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:90;background:radial-gradient(900px 500px at 50% -10%,rgba(59,130,246,.16),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;overflow-y:auto}
.gate-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -30px #000}
.gate-brand{display:flex;justify-content:center;margin-bottom:6px}
.gate-brand img{max-width:190px;max-height:66px;object-fit:contain}
.gate-brand .dot{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#1e3a8a);display:grid;place-items:center;font-weight:700}
.gate h2{margin:0;font-size:17px;text-align:center}
.gate p.sub{margin:0;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
.gate label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
.gate input,.gate select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;outline:none}
.gate input:focus,.gate select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate .row{display:flex;gap:10px}.gate .row>*{flex:1}
.gate .err{color:#fca5a5;font-size:12.5px;min-height:16px}
.gate-note{color:var(--dim);font-size:11.5px;text-align:center;max-width:400px;margin:0}
.who{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.who b{color:var(--text);font-weight:600}
.who .role{font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.who button{margin-left:auto}
.storeline{grid-column:1/-1;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;padding-top:2px}
.storeline i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.storeline.warn i{background:var(--warn)}.storeline.err i{background:var(--err)}
.storeline.err,.storeline.warn{color:var(--text)}
.storeline button{background:none;border:0;color:var(--accent);font-size:11px;padding:0;text-decoration:underline;cursor:pointer}
.saved.warn{color:#fcd34d}.saved.err{color:#fca5a5}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:70;max-width:760px;display:flex;align-items:center;gap:12px;background:#2a1215;border:1px solid var(--err);color:#fecaca;padding:10px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.banner.warn{background:#2a2112;border-color:var(--warn);color:#fde68a}
.banner button{flex:none}
/* ---------- Lead-Import ---------- */
.lead{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.lead textarea{width:100%;min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;resize:vertical}
.lead textarea:focus{border-color:var(--accent)}
.lead .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.lead .row>div{flex:1;min-width:150px}
.lead label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
.lead select,.lead input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.map .mi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.map .mi .h{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map .mi .ex{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.map select{margin-top:6px;font-size:12.5px;padding:6px 8px}
.lead .sum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lead .sum b{font-size:17px;display:block}
.lead .sum .dup b{color:#fcd34d}
.ltab{width:100%;border-collapse:collapse;font-size:12.5px}
.ltab th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.ltab td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.ltab tr.dup td{color:var(--dim);text-decoration:line-through}
.lscroll{max-height:230px;overflow-y:auto}
/* ---------- Dashboard ---------- */
.dash{display:none;overflow-y:auto;min-height:0;padding:22px 26px 60px;grid-column:2/-1}
.app.dash-on{grid-template-columns:260px 1fr}
.app.dash-on .editor,.app.dash-on .preview{display:none}
.app.dash-on .dash{display:block}
.dash h1{font-size:19px;margin:0 0 2px}
.dash .lead{color:var(--muted);font-size:13px;margin:0 0 22px}
.dash section{margin-bottom:28px}
.dash h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--dim)}
.kpi .d.up{color:#86efac}.kpi .d.down{color:#fca5a5}
.kpi.accent{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}.kpi.accent .v{color:#86efac}

/* ---------------- Anmeldung & Rollen ----------------
   Hinweis: Das ist eine Rollentrennung für den Arbeitsalltag, kein echter
   Zugriffsschutz – die Datei liegt lokal und kann im Editor gelesen werden.
   Passwörter werden nur als SHA-256-Hash mit Zufalls-Salt gespeichert. */
const SESSION_KEY = "kabara-portal-session";
function randomSalt() {
  const a = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256));
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashPw(pw, salt) {
  const txt = salt + "|" + pw;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;           // Fallback ohne WebCrypto
  for (let i = 0; i < txt.length; i++) { h1 = (h1 ^ txt.charCodeAt(i)) >>> 0; h1 = Math.imul(h1, 16777619) >>> 0; h2 = Math.imul(h2 ^ txt.charCodeAt(i), 2654435761) >>> 0; }
  return "fnv" + h1.toString(16) + h2.toString(16);
}

/* ---- Persistenz: Daten-Datei (Chrome) → IndexedDB → localStorage ----
   Mehrere Ebenen, weil localStorage bei lokal geöffneten Dateien vom Browser
   jederzeit geleert werden kann. Beim Start gewinnt die zuletzt gespeicherte Quelle. */
const DB_NAME = "kabara-vertriebsportal", DB_STORE = "kv";
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("IndexedDB nicht verfügbar"));
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error("IndexedDB-Fehler"));
    req.onblocked = () => rej(new Error("IndexedDB blockiert"));
  });
}
async function idbReq(mode, fn) {

  async writeFile(json) {

  },
  async connectFile() {
    if (!this.can.fsa) return toast("Dieser Browser kann keine Daten-Datei verbinden. Nutze regelmäßig „⤓ Backup“.", true);

      const h = await window.showSaveFilePicker({

        types: [{ description: "Portal-Daten", accept: { "application/json": [".json"] } }]
      });
      this.handle = h; this.fileName = h.name; this.fileError = "";

      const existing = await this.readFile();

        if (!state.customers.length || confirm(`„${h.name}“ enthält ${existing.customers.length} Kunden.\n\nOK = Daten aus der Datei laden\nAbbrechen = aktuelle Daten in die Datei schreiben`)) {

  }

.card .ic{width:46px;height:46px;border-radius:11px;background:var(--c1l);display:grid;place-items:center;margin-bottom:18px}
.card .ic svg{width:22px;height:22px;stroke:var(--c1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:20px;margin-bottom:8px;${f.up ? "letter-spacing:.02em" : ""}}.card p{margin:0;color:var(--mut);font-size:15.5px}
.about{background:var(--soft)}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.about p.t{font-size:18px;color:#343841;margin:18px 0 26px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.fact b{display:block;font-family:${f.head};font-size:30px;color:var(--c1);line-height:1.1}.fact span{color:var(--mut);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:st}
.step{position:relative;padding:30px 26px;border-radius:14px;background:var(--c1);color:var(--on1)}
.step::before{counter-increment:st;content:"0" counter(st);display:block;font-family:${f.head};font-size:38px;color:var(--c2);margin-bottom:10px;line-height:1}
.step h3{font-size:20px;margin-bottom:6px}.step p{margin:0;opacity:.82;font-size:15.5px}
.demo-tag{font-style:normal;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:2px 7px;border-radius:99px;margin-left:8px;white-space:nowrap}
.reviews .demo-tag{background:var(--soft);border-color:var(--line);color:var(--mut)}
.rsum{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;margin:26px 0 40px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left}
.rcard{margin:0;border:1px solid var(--line);border-radius:14px;padding:24px;background:#fff;display:flex;flex-direction:column;gap:12px}
.rcard .s{color:#fbbf24;font-size:16px;letter-spacing:2px}
.rcard blockquote{margin:0;font-size:15.5px;color:#31353d;line-height:1.65}
.rcard figcaption{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:auto;flex-wrap:wrap}
.rcard .av{width:34px;height:34px;border-radius:50%;background:var(--c1l);color:var(--c1);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.rnote{margin:26px auto 0;max-width:620px;font-size:13px;color:var(--mut);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px 16px}
.cartbtn{position:relative;background:none;border:0;cursor:pointer;padding:8px;color:var(--ink);flex:none}
.cartbtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cartbtn .cnt{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:99px;background:var(--c2);color:var(--on2);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cartbtn .cnt[data-empty="1"]{display:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:0 16px 40px -20px rgba(0,0,0,.35);transform:translateY(-2px)}
.pcard img,.pcard .pimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,var(--c1l),#eef2f7)}
.pbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{font-size:18px}
.pbody p{margin:0;font-size:14.5px;color:var(--mut);flex:1}
.prow2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap}
.preis{font-family:${f.head};font-size:22px;color:var(--c1)}
.addbtn{padding:10px 16px;font-size:14.5px;border:0;cursor:pointer}
.paybar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:34px}
.pay{font-size:12.5px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:7px 14px;background:#fff}
.cartwrap{position:fixed;inset:0;z-index:80}
.cartbg{position:absolute;inset:0;background:rgba(10,12,16,.5);animation:fadeIn .2s ease both}
.cart{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);animation:slideIn .28s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.cart header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.cart header b{font-family:${f.head};font-size:19px}
.cart header button{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);padding:4px 8px}
.cartbody{flex:1;overflow-y:auto;padding:16px 22px}
.citem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.citem img,.citem .ph{width:58px;height:58px;border-radius:9px;object-fit:cover;background:var(--c1l);flex:none}
.citem .cn{flex:1;min-width:0}
.citem .cn b{display:block;font-size:14.5px}
.citem .cn span{font-size:13px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;line-height:1}
.qty b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.cart footer{border-top:1px solid var(--line);padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.srow.total{font-size:19px;color:var(--ink);font-weight:600;font-family:${f.head}}
.payopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.payopt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;background:#fff;text-align:left}
.payopt.on{border-color:var(--c2);box-shadow:0 0 0 2px ${mix(c2, "#ffffff", .75)}}
.payopt i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.payopt.on i{border-color:var(--c2);background:var(--c2)}
.cartnote{font-size:12px;color:var(--mut);text-align:center;margin:0}
.cartdone{text-align:center;padding:30px 10px}
.cartdone .ok{width:56px;height:56px;border-radius:50%;background:#ecfdf5;color:#15803d;display:grid;place-items:center;font-size:27px;margin:0 auto 14px}
.cartdone h3{font-size:20px;margin-bottom:6px}
.cartdone p{color:var(--mut);font-size:14px;margin:0}
.cempty{color:var(--mut);text-align:center;padding:40px 10px;font-size:14.5px}
.plist{max-width:820px;margin:0 auto}
.pgrp{font-size:17px;margin:28px 0 8px;color:var(--c1)}
.pgrp:first-child{margin-top:0}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.prow .pn{font-weight:600}
.prow .pn span{display:block;font-weight:400;font-size:14px;color:var(--mut);margin-top:3px}
.prow .pp{font-family:${f.head};font-size:19px;color:var(--c1);white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}
.tcard{margin:0;text-align:center}
.tcard img,.tcard .tph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--c1l);display:grid;place-items:center;font-size:40px;color:var(--c1);font-family:${f.head}}
.tcard figcaption{margin-top:14px}
.tcard b{display:block;font-size:16px}
.tcard span{font-size:14px;color:var(--mut)}
.mapwrap{border-radius:16px;overflow:hidden;min-height:260px;background:var(--soft);border:1px solid rgba(255,255,255,.12)}
.mapwrap iframe{width:100%;height:320px;border:0;display:block}
.maploader{width:100%;min-height:260px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:0;cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px;font:inherit}
.maploader svg{width:30px;height:30px;stroke:var(--c2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.maploader b{font-size:16px}.maploader span{font-size:14px;opacity:.8}.maploader em{font-style:normal;font-size:12px;opacity:.6}
.maploader:hover{background:rgba(255,255,255,.12)}
.reviews{text-align:center}
.rbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;padding:34px 50px;margin-top:10px}
.rbox .big{font-family:${f.head};font-size:56px;line-height:1;color:var(--c1)}.rbox .s{color:#fbbf24;font-size:26px;letter-spacing:3px}.rbox small{color:var(--mut)}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-weight:600;font-size:17px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:400;color:var(--c2d);transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0 0 22px;color:var(--mut)}
.contact{background:var(--c1);color:var(--on1)}
.contact .kick{color:var(--c2)}
.contact .split{align-items:start}
.cl{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:16px}
.cl li{display:flex;gap:14px;align-items:flex-start}.cl a{text-decoration:none}
.cl .i{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.cl svg{width:19px;height:19px;stroke:var(--c2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cl small{display:block;opacity:.65;font-size:13px}
form.cf{background:#fff;color:var(--ink);border-radius:16px;padding:30px;display:grid;gap:14px}
form.cf h3{font-size:22px}
form.cf label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
form.cf input,form.cf textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--soft)}
form.cf input:focus,form.cf textarea:focus{outline:2px solid var(--c2);border-color:transparent;background:#fff}
form.cf textarea{min-height:120px;resize:vertical}
form.cf .b{border:0;cursor:pointer;font:inherit;font-weight:600}
.okmsg{display:none;background:#ecfdf5;color:#065f46;padding:12px 14px;border-radius:9px;font-size:14px}
footer{background:${mix(c1, "#000000", .45)};color:rgba(255,255,255,.7);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:26px;padding-bottom:26px}
footer a{text-decoration:none}footer a:hover{color:#fff}
.float{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:10px}
.float a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.float svg{width:25px;height:25px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media(max-width:900px){
  .grid,.steps,.rgrid,.pgrid{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr;gap:40px}
  .links{position:fixed;inset:70px 0 auto 0;background:#fff;flex-direction:column;align-items:stretch;gap:0;padding:10px 20px 20px;border-bottom:1px solid var(--line);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .2s,transform .2s,visibility .2s;box-shadow:0 20px 30px -20px rgba(0,0,0,.2)}
  .links.open{opacity:1;visibility:visible;transform:none}.links a{padding:14px 0;border-bottom:1px solid var(--line)}.links .b{margin-top:12px;border:0}
  .burger{display:block}
  .burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.x span:nth-child(2){opacity:0}.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
}
@media(max-width:600px){.grid,.steps,.facts,.rgrid,.pgrid{grid-template-columns:1fr}.payopts{grid-template-columns:1fr}.tgrid{grid-template-columns:1fr 1fr}section.s{padding:64px 0}.hero .w{padding-top:64px;padding-bottom:72px}.hero .b{width:100%}.rbox{padding:28px 30px}.demo{display:none}}
</style></head>
<body>
<div class="demo">Demo-Entwurf von <b>${esc(s.firma)}</b></div>
<header><div class="w nav">
  <a class="logo" href="#top">${logo ? `<img src="${esc(logo)}" alt="${esc(name)}">` : `<span class="mk">${esc(name.trim().charAt(0).toUpperCase() || "•")}</span><span>${esc(name)}</span>`}</a>
  <nav class="links" id="links"><a href="#leistungen">Leistungen</a>${showPreise ? `<a href="#preise">Preise</a>` : ""}${showTeam ? `<a href="#team">Team</a>` : ""}${showShop ? `<a href="#shop">Shop</a>` : ""}<a href="#ueber-uns">Über uns</a>${showRev ? `<a href="#bewertungen">Bewertungen</a>` : ""}<a href="#kontakt">Kontakt</a>${tel ? `<a class="b b1" href="tel:${esc(tel)}">${esc(c.tel)}</a>` : `<a class="b b1" href="#kontakt">Anfrage</a>`}</nav>
  ${showShop ? `<button class="cartbtn" id="cartbtn" aria-label="Warenkorb öffnen">
    <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
    <span class="cnt" id="cartcount">0</span>
  </button>` : ""}
  <button class="burger" id="burger" aria-label="Menü öffnen" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>

<section class="hero" id="top"><div class="w">
  ${c.stadt ? `<div class="eyebrow">📍 ${esc(p.kw)} in ${esc(c.stadt)}</div>` : ""}
  <h1>${esc(hero)}</h1>
  <p class="lead">${esc(sub)}</p>
  <div class="cta">${ctaPrimary}<a class="b b2" href="#leistungen">Unsere Leistungen</a></div>
  <div class="rate"><span class="s">${stars(rating)}</span><span><b>${esc(rating.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }))}</b>${ratingCount ? ` aus ${ratingCount} Google-Bewertungen` : " bei Google"}</span>${rat.demo ? `<em class="demo-tag">Beispielwerte</em>` : ""}</div>
</div></section>

<div class="trust"><ul>${usps.map(u => `<li><svg viewBox="0 0 24 24">${ICONS[1]}</svg>${esc(fill(u, c))}</li>`).join("")}</ul></div>

<section class="s" id="leistungen"><div class="w">
  <div class="kick">Leistungen</div>
  <h2 class="reveal">Was wir für Sie tun</h2>
  <p class="intro reveal">${esc(fill(`Alles aus einer Hand – zuverlässig und mit persönlicher Betreuung in {stadt}.`, c))}</p>
  <div class="grid">${services.map((sv, i) => `<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24">${ICONS[i % ICONS.length]}</svg></div><h3>${esc(fill(sv[0], c))}</h3>${sv[1] ? `<p>${esc(fill(sv[1], c))}</p>` : ""}</article>`).join("")}</div>
</div></section>

<section class="s about" id="ueber-uns"><div class="w split">
  <div class="reveal">
    <div class="kick">Über uns</div>
    <h2>${esc(name)}</h2>
    <p class="t">${nl2br(about)}</p>
    ${ctaPrimary}
  </div>
  <div class="facts reveal">
    ${num(c.gruendung) > 1900 ? `<div class="fact"><b>${Math.max(1, year - Math.round(num(c.gruendung)))}+</b><span>Jahre Erfahrung</span></div>` : `<div class="fact"><b>100%</b><span>Persönliche Betreuung</span></div>`}
    ${rating > 0 ? `<div class="fact"><b>${esc(rating.toLocaleString("de-DE", { maximumFractionDigits: 1 }))} ★</b><span>Google-Bewertung</span></div>` : `<div class="fact"><b>${services.length}</b><span>Leistungsbereiche</span></div>`}
    <div class="fact"><b>${esc(c.stadt ? c.stadt : "Lokal")}</b><span>Vor Ort für Sie</span></div>
    <div class="fact"><b>24h</b><span>Rückmeldung auf Anfragen</span></div>
  </div>
</div></section>

<section class="s"><div class="w">
  <div class="kick">Ablauf</div>
  <h2 class="reveal">So einfach geht's</h2>
  <p class="intro reveal">In drei Schritten zum Ergebnis.</p>
  <div class="steps">${p.steps.map(st => `<div class="step reveal"><h3>${esc(fill(st[0], c))}</h3><p>${esc(fill(st[1], c))}</p></div>`).join("")}</div>
</div></section>

${showRev ? `<section class="s reviews" id="bewertungen"><div class="w">
  <div class="kick">Bewertungen</div>
  <h2 class="reveal">Das sagen unsere Kunden</h2>
  <div class="rsum reveal">
    <div class="rbox"><div class="big">${esc(rating.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }))}</div><div class="s">${stars(rating)}</div><small>${ratingCount ? `${ratingCount} Bewertungen` : "Bewertungen"} auf Google</small></div>
    <a class="b b1" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" rel="noopener">Auf Google ansehen</a>
  </div>
  <div class="rgrid">${rev.list.map(r => `<figure class="rcard reveal">
      <div class="s">${stars(r[1])}</div>
      <blockquote>${esc(fill(r[2], c))}</blockquote>
      <figcaption><span class="av">${esc((r[0] || "?").trim().charAt(0).toUpperCase())}</span><b>${esc(r[0])}</b>${rev.demo ? `<em class="demo-tag">Beispiel</em>` : ""}</figcaption>
    </figure>`).join("")}</div>
  ${rev.demo ? `<p class="rnote">Hinweis für den Entwurf: Diese Rezensionen sind Beispieltexte. In der fertigen Website werden hier Ihre echten Google-Rezensionen eingebunden.</p>` : ""}
</div></section>` : ""}

${showShop ? `<section class="s" id="shop"><div class="w">
  <div class="kick">Shop</div>
  <h2 class="reveal">Jetzt online bestellen</h2>
  <p class="intro reveal">${versandFrei > 0 ? `Versandkostenfrei ab ${esc(eur(versandFrei))} – ` : ""}Lieferung in 1–3 Werktagen.</p>
  <div class="pgrid">${produkte.map((p, i) => `<article class="pcard reveal">
    ${p.bild ? `<img src="${esc(p.bild)}" alt="${esc(p.name)}">` : `<div class="pimg"></div>`}
    <div class="pbody">
      <h3>${esc(p.name)}</h3>
      ${p.info ? `<p>${esc(fill(p.info, c))}</p>` : ""}
      <div class="prow2"><span class="preis">${esc(eur(num(p.preis)))}</span>
      <button class="b b1 addbtn" data-i="${i}" type="button">In den Warenkorb</button></div>
    </div>
  </article>`).join("")}</div>
  ${zahl.length ? `<div class="paybar reveal">${zahl.map(z => `<span class="pay">${esc(z[1])}</span>`).join("")}</div>` : ""}
</div></section>

<div class="cartwrap" id="cartwrap" hidden>
  <div class="cartbg" id="cartbg"></div>
  <aside class="cart" role="dialog" aria-label="Warenkorb">
    <header><b>Warenkorb</b><button id="cartclose" aria-label="Schließen">✕</button></header>
    <div class="cartbody" id="cartbody"></div>
    <footer id="cartfoot"></footer>
  </aside>
</div>` : ""}

${showPreise ? `<section class="s" id="preise"><div class="w">
  <div class="kick">Preise</div>
  <h2 class="reveal">Transparente Preise</h2>
  <p class="intro reveal">Alle Preise verstehen sich als Richtwerte – den genauen Umfang besprechen wir vorab.</p>
  <div class="plist reveal">${preise.map(p => p.gruppe
      ? `<h3 class="pgrp">${esc(fill(p.gruppe, c))}</h3>`
      : `<div class="prow"><div class="pn">${esc(fill(p.name, c))}${p.info ? `<span>${esc(fill(p.info, c))}</span>` : ""}</div><div class="pp">${esc(p.preis)}</div></div>`).join("")}</div>
</div></section>` : ""}

${showTeam ? `<section class="s about" id="team"><div class="w">
  <div class="kick">Team</div>
  <h2 class="reveal">Die Menschen hinter ${esc(name)}</h2>
  <div class="tgrid">${team.map(t => `<figure class="tcard reveal">
      ${t.foto ? `<img src="${esc(t.foto)}" alt="${esc(t.name)}">` : `<div class="tph">${esc((t.name || "?").trim().charAt(0).toUpperCase())}</div>`}
      <figcaption><b>${esc(t.name)}</b>${t.rolle ? `<span>${esc(fill(t.rolle, c))}</span>` : ""}</figcaption>
    </figure>`).join("")}</div>

<script>
(function(){
  var MAPQ=${jsonForScript(adresse ? [name, adresse].filter(Boolean).join(", ") : "")};
  var b=document.getElementById('burger'),l=document.getElementById('links');
  function close(){l.classList.remove('open');b.classList.remove('x');b.setAttribute('aria-expanded','false');}
  b.addEventListener('click',function(){var o=l.classList.toggle('open');b.classList.toggle('x',o);b.setAttribute('aria-expanded',o?'true':'false');});
  l.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});
  var f=document.getElementById('cf');
  f.addEventListener('submit',function(e){e.preventDefault();
    var ok=true;['n','k'].forEach(function(id){var el=document.getElementById(id);var bad=!el.value.trim();el.style.borderColor=bad?'#ef4444':'';if(bad)ok=false;});
    if(ok){document.getElementById('ok').style.display='block';f.querySelector('button').disabled=true;}
  });
  var SHOP=${jsonForScript(produkte.map(p => ({ n: p.name, p: num(p.preis), b: p.bild || "" })))};
  var PAY=${jsonForScript(zahl.map(z => z[1]))};
  var SHIP=${jsonForScript({ v: versand, frei: versandFrei })};
  var cart={}, payi=0, step='cart';
  var wrap=document.getElementById('cartwrap');
  function money(n){return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});}
  function esc2(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
  function count(){var n=0;for(var k in cart)n+=cart[k];return n;}
  function sum(){var s=0;for(var k in cart)s+=SHOP[k].p*cart[k];return s;}
  function ship(){var s=sum();if(!s)return 0;return (SHIP.frei>0&&s>=SHIP.frei)?0:SHIP.v;}
  function paint(){
    var cc=document.getElementById('cartcount');
    if(cc){cc.textContent=count();cc.setAttribute('data-empty',count()?'0':'1');}
    var body=document.getElementById('cartbody'), foot=document.getElementById('cartfoot');
    if(!body)return;
    if(step==='done'){
      body.innerHTML='<div class="cartdone"><div class="ok">✓</div><h3>Bestellung abgeschickt</h3>'+
        '<p>Das ist eine Demo-Ansicht: Es wurde <b>keine</b> Bestellung ausgelöst und keine Zahlung durchgeführt. '+
        'In Ihrem fertigen Shop läuft die Zahlung über Ihren echten Anbieter.</p></div>';
      foot.innerHTML='<button class="b b1" id="cartagain" type="button">Weiter stöbern</button>';
      return;
    }
    var keys=Object.keys(cart);
    if(!keys.length){body.innerHTML='<div class="cempty">Ihr Warenkorb ist noch leer.</div>';foot.innerHTML='';return;}
    body.innerHTML=keys.map(function(k){var p=SHOP[k];return '<div class="citem">'+
      (p.b?'<img src="'+p.b+'" alt="">':'<div class="ph"></div>')+
      '<div class="cn"><b>'+esc2(p.n)+'</b><span>'+money(p.p)+'</span></div>'+
      '<div class="qty"><button data-m="'+k+'" aria-label="weniger">−</button><b>'+cart[k]+'</b><button data-p="'+k+'" aria-label="mehr">+</button></div></div>';}).join('');
    var s=sum(), sh=ship();
    var rows='<div class="srow"><span>Zwischensumme</span><span>'+money(s)+'</span></div>'+
      '<div class="srow"><span>Versand</span><span>'+(sh?money(sh):'kostenlos')+'</span></div>'+
      '<div class="srow total"><span>Gesamt</span><span>'+money(s+sh)+'</span></div>';
    if(step==='pay'&&PAY.length){
      rows+='<div class="payopts">'+PAY.map(function(t,i){return '<button type="button" class="payopt'+(i===payi?' on':'')+'" data-pay="'+i+'"><i></i>'+esc2(t)+'</button>';}).join('')+'</div>'+
        '<button class="b b1" id="cartorder" type="button">Kostenpflichtig bestellen</button>'+
        '<p class="cartnote">Demo-Vorschau – es wird keine Zahlung ausgelöst und keine Zahlungsdaten abgefragt.</p>';
    } else {
      rows+='<button class="b b1" id="cartnext" type="button">'+(PAY.length?'Zur Kasse':'Bestellung abschließen')+'</button>';
    }
    foot.innerHTML=rows;
  }
  function openCart(){wrap.hidden=false;paint();}
  function closeCart(){wrap.hidden=true;}
  document.addEventListener('click',function(e){
    var a=e.target.closest('.addbtn');
    if(a){var i=a.getAttribute('data-i');cart[i]=(cart[i]||0)+1;step='cart';openCart();
      a.textContent='Hinzugefügt ✓';setTimeout(function(){a.textContent='In den Warenkorb';},1200);return;}
    if(e.target.closest('#cartbtn')){step='cart';openCart();return;}
    if(e.target.closest('#cartclose')||e.target.id==='cartbg'){closeCart();return;}
    var mi=e.target.closest('[data-m]'), pl=e.target.closest('[data-p]');
    if(mi){var k=mi.getAttribute('data-m');cart[k]--;if(cart[k]<1)delete cart[k];paint();return;}
    if(pl){var k2=pl.getAttribute('data-p');cart[k2]++;paint();return;}
    var po=e.target.closest('[data-pay]');
    if(po){payi=+po.getAttribute('data-pay');paint();return;}
    if(e.target.closest('#cartnext')){step=PAY.length?'pay':'done';paint();return;}
    if(e.target.closest('#cartorder')){step='done';cart={};paint();return;}
    if(e.target.closest('#cartagain')){step='cart';closeCart();paint();return;}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&wrap&&!wrap.hidden)closeCart();});
  if(document.getElementById('cartcount'))paint();
  var ml=document.getElementById('maploader');
  if(ml){ml.addEventListener('click',function(){
    var f=document.createElement('iframe');
    f.src='https://www.google.com/maps?q='+encodeURIComponent(MAPQ)+'&output=embed';
    f.loading='lazy'; f.title='Karte'; f.referrerPolicy='no-referrer-when-downgrade';
    f.setAttribute('allowfullscreen','');
    ml.parentNode.replaceChild(f,ml);
  });}
  var els=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});els.forEach(function(el){io.observe(el);});}
  else els.forEach(function(el){el.classList.add('in');});
})();
<\/script>
</body></html>`;
}

function ensureNr(c) {

  const s = state.settings, kz = (currentUser() || {}).kuerzel || "", jahr = new Date().getFullYear();
  const lauf = Math.max(1, Math.floor(num(s.nextNr)));
  c.angebotsNr = `${s.prefix || "KD"}${kz ? "-" + kz : ""}-${jahr}-${String(lauf).padStart(3, "0")}`;
  s.nextNr = lauf + 1; save();
  return c.angebotsNr;
}

  const total = eur(k.total);

    subject: `Bestellung ${c.angebotsNr} – ${name} (${total})`
  };

  return `<!doctype html>

(function(){
  var CFG=${jsonForScript(cfg)};
  var start=document.getElementById('start'),form=document.getElementById('of'),done=document.getElementById('done'),err=document.getElementById('oe'),send=document.getElementById('send');
  start.addEventListener('click',function(){form.classList.add('open');start.style.display='none';document.getElementById('on').focus();});
  function fail(m){err.textContent=m;err.style.display='block';}
  function success(){form.style.display='none';done.style.display='block';done.scrollIntoView({behavior:'smooth',block:'center'});}
  form.addEventListener('submit',function(e){
    e.preventDefault();err.style.display='none';
    var n=document.getElementById('on').value.trim(),c=document.getElementById('oc').value.trim(),a=document.getElementById('oa').checked;
    if(!n)return fail('Bitte geben Sie Ihren Namen ein.');
    if(!c)return fail('Bitte geben Sie eine E-Mail-Adresse oder Telefonnummer an.');
    if(!a)return fail('Bitte bestätigen Sie die Bestellung mit dem Häkchen.');
    if(CFG.preview)return success();
    var text='Bestellung '+CFG.nr+'\\nKunde: '+CFG.firma+'\\nName: '+n+'\\nKontakt: '+c+'\\nBetrag: '+CFG.total+'\\nZeitpunkt: '+new Date().toLocaleString('de-DE');
    if(!CFG.key){
      window.location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent(CFG.subject)+'&body='+encodeURIComponent(text);
      return success();
    }
    send.disabled=true;send.textContent='Wird gesendet …';
    fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:CFG.key,subject:CFG.subject,from_name:n,kontakt:c,angebot:CFG.nr,kunde:CFG.firma,betrag:CFG.total,message:text})})
    .then(function(r){return r.json().catch(function(){return {success:r.ok};});})
    .then(function(j){if(j&&j.success)success();else throw new Error();})
    .catch(function(){send.disabled=false;send.textContent='Verbindlich bestellen';
      fail('Die Bestellung konnte nicht gesendet werden. Bitte versuchen Sie es erneut oder schreiben Sie an '+CFG.email+'.');});
  });
})();
<\/script>
</body></html>`;
}

${sig}` },

function toast(msg, isErr) {

$("#statusFilter").insertAdjacentHTML("beforeend", STATUS.map(([k, v]) => `<option value="${k}">${v}</option>`).join(""));
function renderList() {
  const q = state.q.toLowerCase();
  const mine = visibleCustomers();
  const items = mine
    .filter(c => !state.filter || c.status === state.filter)
    .filter(c => !q || [c.firma, c.ansprechpartner, c.stadt, c.angebotsNr].join(" ").toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);
  const st = Object.fromEntries(STATUS);
  $("#list").innerHTML = items.length ? items.map(c => `

$("#list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  select(b.dataset.id);
  app.classList.remove("show-list");
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
$("#statusFilter").addEventListener("change", e => { state.filter = e.target.value; renderList(); });
$("#newBtn").addEventListener("click", () => {
  const c = newCustomer();
  state.customers.push(c);
  state.q = ""; state.filter = ""; $("#q").value = ""; $("#statusFilter").value = "";
  select(c.id);
  saveNow();
  setTimeout(() => { const i = editor.querySelector('[data-f="firma"]'); i && i.focus(); }, 30);
});

function select(id) {
  const c = state.customers.find(x => x.id === id);
  if (c && !canSee(c)) return;
  if (state.view === "dash") showDash(false);
  state.activeId = id;
  app.classList.remove("show-list", "show-preview");
  renderList(); renderEditor(); renderPreview(true); save();
}

// Erzeugt aus einem Logo für helle Flächen eine Variante für dunkle Flächen:
// dunkle (nahezu neutrale) Pixel werden weiß, farbige Bildteile bleiben unangetastet.
function makeLightVariant(dataUrl) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement("canvas");
        cv.width = img.naturalWidth; cv.height = img.naturalHeight;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, cv.width, cv.height), px = d.data;
        for (let i = 0; i < px.length; i += 4) {
          if (px[i + 3] < 12) continue;
          const r = px[i], g = px[i + 1], b = px[i + 2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          if (max < 115 && max - min < 70) { px[i] = 255; px[i + 1] = 255; px[i + 2] = 255; }
        }
        ctx.putImageData(d, 0, 0);
        res(cv.toDataURL("image/png"));
      } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error("Logo konnte nicht gelesen werden."));
    img.src = dataUrl;
  });
}

const IMG_LIMITS = { hero: { w: 1500, h: 950, type: "image/jpeg", q: .78 }, logo: { w: 600, h: 600, type: "image/png", q: .92 }, slogo: { w: 800, h: 300, type: "image/png", q: .92 }, tm: { w: 700, h: 700, type: "image/jpeg", q: .8 } };
function fileToImage(file, kind) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("Keine Bilddatei."));
    if (file.size > 12 * 1024 * 1024) return reject(new Error("Bild ist größer als 12 MB."));
    // SVG und kleine Logos unverändert übernehmen (Transparenz/Schärfe bleiben erhalten)
    if (file.type === "image/svg+xml" || ((kind === "logo" || kind === "slogo") && file.size < 200 * 1024)) {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result));
      fr.onerror = () => reject(new Error("Datei konnte nicht gelesen werden."));
      return fr.readAsDataURL(file);
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const L = IMG_LIMITS[kind], r = Math.min(1, L.w / img.naturalWidth, L.h / img.naturalHeight);
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.naturalWidth * r));
        cv.height = Math.max(1, Math.round(img.naturalHeight * r));
        const ctx = cv.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        if (L.type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        let out = cv.toDataURL(L.type, L.q);
        if (kind === "logo" && out.length > 420 * 1024) out = cv.toDataURL("image/jpeg", .9);
        resolve(out);
      } catch (e) { reject(new Error("Bild konnte nicht verarbeitet werden.")); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Bild konnte nicht geladen werden.")); };
    img.src = url;
  });
}

  if (prdrop && c) { editor.querySelector(`[data-prfile="${prdrop.dataset.prdrop}"]`)?.click(); return; }
  const tdel = e.target.closest("[data-tmdel]");
  if (tdel && c) {
    c.team.splice(+tdel.dataset.tmdel, 1);
    redrawEditorKeepScroll(); touch(); return;
  }
  if (e.target.closest("#addTeam") && c) {
    c.team = (c.team || []).concat([{ name: "", rolle: "", foto: "" }]);
    redrawEditorKeepScroll(); touch(); return;
  }
  const tdrop = e.target.closest("[data-tdrop]");
  if (tdrop && c) { editor.querySelector(`[data-tfile="${tdrop.dataset.tdrop}"]`)?.click(); return; }
  const drop = e.target.closest("[data-drop]");
  if (drop && c) { editor.querySelector(`[data-file="${drop.dataset.drop}"]`)?.click(); return; }
  const pk = e.target.closest("[data-pkg]");
  if (pk && c) {
    c.paket = pk.dataset.pkg;
    editor.querySelectorAll(".pkg").forEach(b => b.classList.toggle("on", b === pk));
    refreshEditorBits(); touch(); return;
  }
  if (e.target.closest("#delBtn") && c) {
    if (!confirm(`„${c.firma || "Unbenannter Kunde"}“ wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
    state.customers = state.customers.filter(x => x.id !== c.id);
    state.activeId = null; renderList(); renderEditor(); renderPreview(true); saveNow(); toast("Kunde gelöscht"); return;
  }
  if (e.target.closest("#dupBtn") && c) {
    const copy = JSON.parse(JSON.stringify(c)); const fresh = newCustomer();
    Object.assign(copy, { id: fresh.id, angebotsNr: fresh.angebotsNr, created: Date.now(), updated: Date.now(), status: "neu", firma: (c.firma || "Kunde") + " (Kopie)", datum: todayISO() });
    state.customers.push(copy); select(copy.id); saveNow(); toast("Kunde dupliziert"); return;
  }
  if (e.target.closest("#winBtn") && c) {
    if (!c.paket) return toast("Bitte zuerst ein Paket wählen – daraus ergibt sich die Provision.", true);
    c.status = "gewonnen"; c.gewonnenAm = todayISO();
    touch(); renderList(); renderProvision(); redrawEditorKeepScroll(); feiern(c);
    return;
  }
  if (e.target.closest("#toPreview")) { app.classList.add("show-preview"); renderPreview(true); return; }
  if (e.target.closest("#toList")) { app.classList.add("show-list"); return; }
});

/* ---- Preview ---- */
let lastScroll = { key: "", y: 0 };
function renderPreview(resetScroll) {
  const c = active();
  const isMail = state.tab === "mail";
  $("#frameWrap").hidden = isMail || !c;
  mailsEl.hidden = !isMail && !!c;
  $("#device").style.display = isMail ? "none" : "";
  $("#printBtn").style.display = state.tab === "offer" ? "" : "none";
  $("#openTab").style.display = isMail ? "none" : "";
  ["#dlBtn", "#zipBtn", "#openTab", "#printBtn"].forEach(s => $(s).disabled = !c);
  $("#dlBtn").style.display = isMail ? "none" : "";

  if (!c) { mailsEl.hidden = false; mailsEl.innerHTML = `<div class="no-cust">Wähle links einen Kunden aus oder lege einen neuen an.</div>`; return; }
  if (isMail) { renderMails(c); return; }

  const key = c.id + state.tab;
  try { if (!resetScroll && lastScroll.key === key && frame.contentWindow) lastScroll.y = frame.contentWindow.scrollY; else lastScroll.y = 0; } catch { lastScroll.y = 0; }
  lastScroll.key = key;
  const y = lastScroll.y;
  const html = state.tab === "demo" ? buildDemo(c) : buildOffer(c, { preview: true });
  const finish = () => { try { frame.contentWindow.scrollTo(0, y); frame.contentDocument.querySelectorAll(".reveal").forEach(el => el.classList.add("in")); } catch (e) {} };
  frame.onload = finish;
  // Synchron ins Dokument schreiben statt srcdoc: zwei schnelle Wechsel (z. B.
  // Kunde wählen + Tab klicken) können sich bei srcdoc sonst überholen.
  try {
    const doc = frame.contentDocument;
    doc.open(); doc.write(html); doc.close();
    finish();
  } catch (e) { frame.srcdoc = html; }
  $("#frameWrap").classList.toggle("mobile", state.device === "mobile");
}

function renderMails(c) {
  const mails = buildMails(c);
  mailsEl.innerHTML = `
    <p class="hint" style="margin:0 0 14px">Texte sind direkt bearbeitbar. Änderungen hier werden nicht gespeichert – bei Kundenänderungen wird neu generiert.</p>
    ${mails.map(m => `
    <div class="mail" data-key="${m.key}">
      <div class="mail-h"><b>${esc(m.label)}</b><span class="when">${esc(m.when)}</span><span class="spacer" style="flex:1"></span>
        ${m.subject ? `<button class="btn" data-act="copy-subj">Betreff kopieren</button>` : ""}
        <button class="btn" data-act="copy">Text kopieren</button>
        ${m.key === "whatsapp" ? (c.whatsapp || c.tel ? `<button class="btn primary" data-act="wa">In WhatsApp öffnen</button>` : "") : `<button class="btn primary" data-act="mailto">In Mail öffnen</button>`}
      </div>
      <div class="mail-b">
        ${m.subject ? `<input data-part="subject" value="${esc(m.subject)}" aria-label="Betreff">` : ""}
        <textarea data-part="body" aria-label="Text" style="${m.key === "whatsapp" ? "min-height:110px" : ""}">${esc(m.body)}</textarea>
      </div>
    </div>`).join("")}`;
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } finally { ta.remove(); } }
  toast("In die Zwischenablage kopiert");
}
mailsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const box = b.closest(".mail"), c = active(); if (!box || !c) return;
  const subj = box.querySelector('[data-part="subject"]')?.value || "";
  const body = box.querySelector('[data-part="body"]').value;
  const act = b.dataset.act;
  if (act === "copy") copyText(body);
  else if (act === "copy-subj") copyText(subj);
  else if (act === "mailto") {
    const url = `mailto:${encodeURIComponent(c.email || "").replace(/%40/g, "@")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
    if (url.length > 1900) { copyText(body); toast("Text ist lang – wurde kopiert. Bitte im Mailprogramm einfügen."); }
    window.location.href = url;
    if (box.dataset.key === "erst" && c.status === "neu") { c.status = "demo"; touch(); renderList(); rememberOpen(); renderEditor(); }
    if (box.dataset.key === "angebot" && (c.status === "neu" || c.status === "demo")) { c.status = "angebot"; touch(); renderList(); rememberOpen(); renderEditor(); }
  } else if (act === "wa") {
    let n = telHref(c.whatsapp || c.tel).replace(/^\+/, "");
    if (n.startsWith("00")) n = n.slice(2); else if (n.startsWith("0")) n = "49" + n.slice(1);
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(body)}`, "_blank", "noopener");
  }
});

function download(filename, content, type = "text/html;charset=utf-8") {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const fileBase = c => slug(c.firma);
$("#dlBtn").addEventListener("click", () => {
  const c = active(); if (!c) return;
  if (state.tab === "demo") download(`${fileBase(c)}-demo.html`, buildDemo(c));
  else if (state.tab === "offer") download(`Angebot-${slug(c.angebotsNr)}-${fileBase(c)}.html`, buildOffer(c));
});
$("#openTab").addEventListener("click", () => {
  const c = active(); if (!c) return;
  const html = state.tab === "demo" ? buildDemo(c) : buildOffer(c, { preview: true });
  const url = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
  const w = window.open(url, "_blank");
  if (!w) toast("Pop-up blockiert – bitte „HTML“ herunterladen.", true);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
$("#printBtn").addEventListener("click", () => {
  const c = active(); if (!c) return;
  // Druck über ein verstecktes iframe, damit die Vorschau nicht verändert wird
  const pf = document.createElement("iframe");
  pf.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(pf);
  pf.onload = () => {
    setTimeout(() => {
      try { pf.contentDocument.title = `Angebot-${c.angebotsNr}-${fileBase(c)}`; pf.contentWindow.focus(); pf.contentWindow.print(); }
      catch { toast("Drucken nicht möglich – bitte HTML öffnen und dort drucken.", true); }
      setTimeout(() => pf.remove(), 2000);
    }, 400); // Webfonts laden lassen
  };
  pf.srcdoc = buildOffer(c);
});
$("#zipBtn").addEventListener("click", async () => {
  const c = active(); if (!c) return;
  const base = fileBase(c);
  const mails = buildMails(c).map(m => `==== ${m.label} (${m.when}) ====\n${m.subject ? "Betreff: " + m.subject + "\n\n" : ""}${m.body}\n`).join("\n\n");
  const files = [
    [`demo-website/index.html`, buildDemo(c)],
    [`Angebot-${slug(c.angebotsNr)}-${base}.html`, buildOffer(c)],
    [`E-Mail-Vorlagen-${base}.txt`, mails],
    [`kunde-${base}.json`, JSON.stringify(c, null, 2)]
  ];
  if (window.JSZip) {
    const zip = new JSZip(); const dir = zip.folder(base);
    files.forEach(([n, t]) => dir.file(n, t));
    download(`${base}-vertriebspaket.zip`, await zip.generateAsync({ type: "blob" }));
    toast("ZIP heruntergeladen");
  } else {
    files.forEach(([n, t], i) => setTimeout(() => download(n.replace("/", "-"), t, n.endsWith(".json") ? "application/json" : n.endsWith(".txt") ? "text/plain;charset=utf-8" : "text/html;charset=utf-8"), i * 400));
    toast("ZIP nicht verfügbar (offline) – Dateien einzeln heruntergeladen");
  }
});

async function scanWebsite() {

  $("#scanModal").classList.add("open");
  renderScan("laden", `${url} wird geladen …`);
  for (let i = 0; i < PROXIES.length; i++) {
    const p = PROXIES[i];
    renderScan("laden", `${url} wird geladen – Versuch ${i + 1} von ${PROXIES.length} (${p.name}). Das dauert oft 10–20 Sekunden.`);
    try {
      const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 25000);
      const res = await fetch(p.url(url), { redirect: "follow", signal: ctrl.signal }).finally(() => clearTimeout(to));
      if (!res.ok) continue;
      const body = await res.text();
      if (!body || body.length < 80) continue;
      scanState.daten = p.typ === "html" ? scanHtml(body, url) : scanText(body);
      Object.keys(scanState.daten).forEach(k => { if (scanState.daten[k]) scanState.wahl[k] = !c[k] || k === "leistungen"; });
      renderScan("fertig");

    if (rec.email && c.email && rec.email.toLowerCase() === c.email.toLowerCase()) return true;
    if (rec.tel && c.tel && telHref(rec.tel) && telHref(rec.tel) === telHref(c.tel)) return true;
    if (rec.firma && c.firma && normFirma(rec.firma) === normFirma(c.firma)) return true;
    return false;
  });
}

const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(canvas, gold, big) {
  const ctx = canvas.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = gold ? ["#fbbf24", "#fde68a", "#f59e0b", "#fff7ed", "#facc15"] : ["#22c55e", "#86efac", "#3b82f6", "#ffffff", "#a78bfa"];
  const P = [];
  const add = o => P.push(Object.assign({ g: .15 + Math.random() * .12, s: 6 + Math.random() * 9,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .34, w: Math.random() * Math.PI * 2,
    c: cols[(Math.random() * cols.length) | 0], life: 1, form: Math.random() < .3 ? "c" : "r" }, o));

    for (let i = 0; i < n; i++) {
      const spread = aim == null ? Math.PI * 2 : 1.25;
      const a = aim == null ? Math.random() * Math.PI * 2 : aim + (Math.random() - .5) * spread;
      const sp = power * (0.45 + Math.random() * 1.05);
      add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    }
  };
  const n = big ? 210 : 140;
  burst(-10, H + 10, n, 17, -Math.PI / 3.1);          // von unten links
  burst(W + 10, H + 10, n, 17, -Math.PI + Math.PI / 3.1); // von unten rechts
  setTimeout(() => burst(W * .5, H * .3, Math.round(n * .8), 12), 220);
  if (big) setTimeout(() => { burst(W * .28, H * .62, n, 14); burst(W * .72, H * .62, n, 14); }, 560);
  // Konfettiregen von oben
  let regen = 0;
  const regenTimer = setInterval(() => {
    for (let i = 0; i < (big ? 14 : 9); i++) add({ x: Math.random() * W, y: -20, vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 3 });
    if (++regen > (big ? 26 : 16)) clearInterval(regenTimer);
  }, 70);
  let raf, stop = false;
  const tick = () => {
    ctx.clearRect(0, 0, W, H);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.vy += p.g; p.vy = Math.min(p.vy, 9); p.vx *= 0.992; p.w += .12;

      else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
      ctx.restore();
    }
    if (!stop) raf = requestAnimationFrame(tick); else { clearInterval(regenTimer); ctx.clearRect(0, 0, W, H); }
  };
  tick();
  return () => { stop = true; clearInterval(regenTimer); cancelAnimationFrame(raf); };
}
function celebrationSound(gold) {
  if (state.settings.sound === false) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = new AC(), now = ac.currentTime;
    const notes = gold ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.85);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.9);
    });

  } catch (e) {}
