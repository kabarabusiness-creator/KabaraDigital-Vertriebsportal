    requestAnimationFrame(step);
    setTimeout(() => { const b = $("#celeBar"); if (b) b.style.width = pct(o.nachher).toFixed(1) + "%"; }, 80);
  } else {
    $("#celeAmount").textContent = "+" + eur(o.betrag);
    $("#celeBar").style.width = pct(o.nachher).toFixed(1) + "%";
  }
  celebrationSound(gold);
  clearTimeout(celeTimer);
  celeTimer = setTimeout(closeCele, gold ? 11000 : 8000);
}
document.addEventListener("click", e => {
  if (e.target.closest("#celeClose") || e.target.id === "cele") closeCele();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#cele").hidden) closeCele(); });

/* ---- Provision ---- */
const monthKey = d => { const x = typeof d === "string" ? parseISO(d) : d; return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"); };
const monthLabel = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" }); };
function provisionStufen() {
  const p = state.settings.provision || {};
  return (Array.isArray(p.stufen) ? p.stufen : []).map(st => ({ ab: num(st.ab), pct: num(st.pct) })).filter(st => st.ab > 0).sort((a, b) => a.ab - b.ab);
}
const paketProvision = c => { const p = (state.settings.pakete || []).find(x => x.id === c.paket); return p ? num(p.provision) : 0; };
function provisionData(userId, mk) {
  const cfg = state.settings.provision || {};
  const stufen = provisionStufen(), modus = ["paket", "umsatz", "deals"].includes(cfg.modus) ? cfg.modus : "paket";
  const deals = state.customers.filter(c => c.status === "gewonnen" && (!userId || c.owner === userId) && monthKey(c.gewonnenAm || c.datum) === mk);
  const umsatz = deals.reduce((a, c) => a + calc(c).netto, 0);
  if (modus === "paket") {
    const basis = deals.reduce((a, c) => a + paketProvision(c), 0);
    const ziel = Math.max(1, num(cfg.ziel) || 1500);
    const bonusBetrag = Math.max(0, num(cfg.bonus));
    const bonusOffen = basis >= ziel ? bonusBetrag : 0;
    const provision = basis + bonusOffen;
    const pakete = (state.settings.pakete || []).filter(p => num(p.provision) > 0);
    const best = pakete.slice().sort((a, b) => num(b.provision) - num(a.provision))[0] || null;
    const fehlt = Math.max(0, ziel - basis);
    return {
      modus, deals, count: deals.length, umsatz, provision, basis, ziel, wert: basis, max: ziel,
      stufen: pakete.map(p => ({ ab: num(p.provision), pct: 0, name: p.name })),
      fehlt, bestPaket: best, naechste: fehlt > 0 ? { ab: ziel, pct: 0 } : null,
      bonus: bonusOffen, bonusBetrag, zielErreicht: basis >= ziel,
      pct: 0, stufe: null, schnitt: deals.length ? basis / deals.length : 0
    };
  }
  const wert = modus === "deals" ? deals.length : umsatz;
  let stufe = null, naechste = null;
  stufen.forEach(st => { if (wert >= st.ab) stufe = st; else if (!naechste) naechste = st; });
  const pct = stufe ? stufe.pct : 0;
  const provision = umsatz * pct / 100;
  const schnitt = deals.length ? umsatz / deals.length : 0;
  let fehlt = 0, bonus = 0;
  if (naechste) {
    fehlt = naechste.ab - wert;
    const umsatzDann = modus === "deals" ? umsatz + fehlt * (schnitt || 0) : naechste.ab;
    bonus = umsatzDann * naechste.pct / 100 - provision;
  }
  const max = stufen.length ? stufen[stufen.length - 1].ab : 1;
  return { modus, deals, count: deals.length, umsatz, wert, stufe, naechste, pct, provision, fehlt, bonus, stufen, max, schnitt };
}
function provBar(d, big) {
  const span = Math.max(d.max, d.wert || 1);
  const pos = v => Math.max(0, Math.min(100, (v / span) * 100));
  const marks = d.modus === "paket"
    ? [{ ab: d.ziel, label: eur(d.ziel), title: "Monatsziel" }]
    : d.stufen.map(st => ({ ab: st.ab, label: st.pct + "%", title: `${st.pct} % ab ${st.ab}${d.modus === "deals" ? " Abschlüssen" : " € Umsatz"}` }));
  return `<div class="bar${big ? " big" : ""}">
    <div class="bar-fill" style="width:${pos(d.wert).toFixed(1)}%"></div>
    ${marks.map(m => `<span class="bar-tick${d.wert >= m.ab ? " on" : ""}" style="left:${pos(m.ab)}%" title="${esc(m.title)}"><i></i>${big ? `<b>${esc(m.label)}</b>` : ""}</span>`).join("")}
  </div>`;
}
function provSatz(d, lang) {
  if (d.modus === "paket") {
    const pakete = (state.settings.pakete || []).filter(p => num(p.provision) > 0);
    if (d.fehlt <= 0) return d.bonusBetrag > 0
      ? `Monatsziel erreicht – <b class="up">${eur(d.bonusBetrag)} Bonus</b> gesichert 🎉 Jeder weitere Abschluss kommt obendrauf.`
      : `Monatsziel von ${eur(d.ziel)} erreicht 🎉`;
    const best = d.bestPaket;
    const noetig = best ? Math.ceil(d.fehlt / num(best.provision)) : 0;
    const bonusHinweis = d.bonusBetrag > 0 ? ` – dann <b class="up">+${eur(d.bonusBetrag)} Bonus</b>` : "";
    const kurz = `Noch <b>${eur(d.fehlt)}</b> bis ${eur(d.ziel)}${bonusHinweis}`;
    if (!best || !noetig) return kurz;
    return lang
      ? `${kurz}. Das sind <b>${noetig} × ${esc(best.name)}</b> (${eur(num(best.provision))} je Abschluss). Übersicht: ${pakete.map(p => `${esc(p.name)} ${eur(num(p.provision))}`).join(" · ")}.`
      : `${kurz} · ${noetig} × ${esc(best.name)}`;
  }
  if (d.naechste) {
    const fehlt = d.modus === "deals" ? Math.ceil(d.fehlt) + (Math.ceil(d.fehlt) === 1 ? " Abschluss" : " Abschlüsse") : eur(d.fehlt);
    const bonus = d.bonus > 0 ? (lang ? ` – das bringt <b class="up">+${eur(d.bonus)}</b> für diesen Monat, weil die höhere Stufe für alle Abschlüsse des Monats gilt.` : ` · <span class="up">+${eur(d.bonus)}</span>`) : "";
    return `Noch <b>${fehlt}</b> bis ${d.naechste.pct} %${bonus}`;
  }
  return d.stufe ? `Höchste Stufe erreicht – ${d.stufe.pct} % auf alles 🎉` : `Noch kein Abschluss diesen Monat`;
}
function renderProvision() {
  const el = $("#prov"); if (!el || !state.user) return;
  const mk = monthKey(new Date());
  const d = provisionData(isAdmin() ? (state.provUser || null) : state.user, mk);
  el.innerHTML = `
    <button class="prov-head" id="provOpen" type="button">
      <span class="k">Provision ${esc(monthLabel(mk))}</span>
      <b>${eur(d.provision)}</b>
    </button>
    ${provBar(d, false)}
    <div class="prov-sub">${provSatz(d, false)}</div>`;
}
function renderCockpit() {
  const mk = state.provMonth || monthKey(new Date());
  const admin = isAdmin();
  const list = admin ? users() : users().filter(u => u.id === state.user);
  const months = [...new Set(state.customers.filter(c => c.status === "gewonnen").map(c => monthKey(c.gewonnenAm || c.datum)))];
  if (!months.includes(monthKey(new Date()))) months.push(monthKey(new Date()));
  months.sort().reverse();
  const mine = provisionData(admin ? null : state.user, mk);
  const p = state.settings.provision || {};
  $("#cockpitBody").innerHTML = `
    <div class="ck-top">
      <select id="ckMonth">${months.map(m => `<option value="${m}"${m === mk ? " selected" : ""}>${esc(monthLabel(m))}</option>`).join("")}</select>
      <span class="hint">${p.modus === "paket" ? "Feste Provision je Paket" : `Staffel nach ${p.modus === "umsatz" ? "Umsatz" : "Abschlüssen"} pro Monat, Provision auf den Netto-Auftragswert`}.</span>
    </div>
    <div class="ck-grid">
      <div class="ck-tile"><span>Abschlüsse</span><b>${mine.count}</b></div>
      <div class="ck-tile"><span>Umsatz</span><b>${eur(mine.umsatz)}</b></div>
      <div class="ck-tile"><span>${mine.modus === "paket" ? "Monatsziel" : "Stufe"}</span><b>${mine.modus === "paket" ? eur(mine.ziel) : mine.pct + " %"}</b></div>
      <div class="ck-tile hi"><span>Provision${mine.bonus > 0 ? " inkl. Bonus" : ""}</span><b>${eur(mine.provision)}</b>${mine.bonus > 0 ? `<span style="color:#86efac">+ ${eur(mine.bonus)} Bonus</span>` : ""}</div>
    </div>
    ${provBar(mine, true)}
    <p class="ck-next">${provSatz(mine, true)}</p>
    ${admin && list.length > 1 ? `<h4 class="ck-h">Team</h4>
      <table class="ck-table"><thead><tr><th>Name</th><th class="r">Abschlüsse</th><th class="r">Umsatz</th><th class="r">${(state.settings.provision || {}).modus === "paket" ? "Ziel" : "Stufe"}</th><th class="r">Provision</th></tr></thead><tbody>
      ${list.map(u => { const d = provisionData(u.id, mk); return `<tr><td>${esc(u.name)}${u.role === "admin" ? " <span class=\"role\">Admin</span>" : ""}</td><td class="r">${d.count}</td><td class="r">${eur(d.umsatz)}</td><td class="r">${d.modus === "paket" ? Math.round(d.ziel ? d.provision / d.ziel * 100 : 0) + " %" : d.pct + " %"}</td><td class="r"><b>${eur(d.provision)}</b></td></tr>`; }).join("")}
      </tbody></table>` : ""}
    <h4 class="ck-h">Abschlüsse in ${esc(monthLabel(mk))}</h4>
    ${mine.deals.length ? `<table class="ck-table"><tbody>${mine.deals.map(c => { const pk = (state.settings.pakete || []).find(p => p.id === c.paket); return `<tr><td>${esc(c.firma || "—")}</td><td>${esc(pk ? pk.name : "–")}</td><td class="r">${eur(calc(c).netto)}</td><td class="r"><b>${eur(mine.modus === "paket" ? paketProvision(c) : calc(c).netto * mine.pct / 100)}</b></td></tr>`; }).join("")}</tbody></table>`
      : `<p class="hint">Sobald ein Kunde auf den Status „Gewonnen" gesetzt wird, erscheint er hier.</p>`}`;
  const sel = $("#ckMonth");
  if (sel) sel.onchange = () => { state.provMonth = sel.value; renderCockpit(); };
}

/* ---- Anmeldung ---- */
const gate = $("#gate"), gateForm = $("#gateForm");
function gateBrandHtml() {
  const s = state.settings;
  return s.logoHell ? `<img src="${esc(s.logoHell)}" alt="${esc(s.firma)}">` : `<div class="dot">${esc((s.firma || "K").charAt(0).toUpperCase())}</div>`;
}
function showGate(mode, msg) {
  $("#gateBrand").innerHTML = gateBrandHtml();
  const body = $("#gateBody");
  if (mode === "setup") {
    body.innerHTML = `
      <h2>Ersteinrichtung</h2>
      <p class="sub">Lege die beiden Zugänge an. Die Passwörter werden nur als Hash gespeichert – notiere sie dir, sie lassen sich nicht auslesen.</p>
      <div><label for="aName">Dein Name (Admin)</label><input id="aName" value="${esc(state.settings.inhaber || "")}" required></div>
      <div class="row">
        <div><label for="aPw">Passwort Admin</label><input id="aPw" type="password" minlength="4" required></div>
        <div><label for="aPw2">Wiederholen</label><input id="aPw2" type="password" minlength="4" required></div>
      </div>
      <div class="row">
        <div><label for="vName">Name Vertriebler</label><input id="vName" placeholder="z. B. Max" required></div>
        <div><label for="vKz">Kürzel</label><input id="vKz" placeholder="MM" maxlength="3"></div>
      </div>
      <div><label for="vPw">Passwort Vertriebler</label><input id="vPw" type="password" minlength="4" required></div>
      <div class="err" id="gateErr">${esc(msg || "")}</div>
      <button class="btn primary block" type="submit">Zugänge anlegen</button>`;
    setTimeout(() => $("#aName")?.focus(), 30);
  } else {
    body.innerHTML = `
      <h2>Anmelden</h2>
      <div><label for="uSel">Benutzer</label><select id="uSel">${users().map(u => `<option value="${esc(u.id)}">${esc(u.name)}${u.role === "admin" ? " (Admin)" : ""}</option>`).join("")}</select></div>
      <div><label for="uPw">Passwort</label><input id="uPw" type="password" required></div>
      <label class="cb" style="font-size:12px"><input type="checkbox" id="uStay"><span>Angemeldet bleiben</span></label>
      <div class="err" id="gateErr">${esc(msg || "")}</div>
      <button class="btn primary block" type="submit">Anmelden</button>`;
    setTimeout(() => $("#uPw")?.focus(), 30);
  }
  gate.hidden = false; $("#app").hidden = true;
}
gateForm.addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#gateErr");
  if ($("#aPw")) {                                   // Ersteinrichtung
    const aName = $("#aName").value.trim(), aPw = $("#aPw").value, aPw2 = $("#aPw2").value;
    const vName = $("#vName").value.trim(), vPw = $("#vPw").value, vKz = $("#vKz").value.trim().toUpperCase();
    if (!aName || !vName) return err.textContent = "Bitte beide Namen ausfüllen.";
    if (aPw.length < 4 || vPw.length < 4) return err.textContent = "Passwörter brauchen mindestens 4 Zeichen.";
    if (aPw !== aPw2) return err.textContent = "Die Admin-Passwörter stimmen nicht überein.";
    if (aPw === vPw) return err.textContent = "Bitte zwei unterschiedliche Passwörter vergeben.";
    const aSalt = randomSalt(), vSalt = randomSalt();
    state.settings.users = [
      { id: "admin", name: aName, role: "admin", salt: aSalt, hash: await hashPw(aPw, aSalt), kuerzel: "" },
      { id: "sales1", name: vName, role: "sales", salt: vSalt, hash: await hashPw(vPw, vSalt), kuerzel: vKz }
    ];
    state.customers.forEach(c => { if (!c.owner) c.owner = "admin"; });
    await loginAs("admin", false);
    saveNow();
    toast("Zugänge angelegt – du bist als Admin angemeldet");
    return;
  }
  const u = users().find(x => x.id === $("#uSel").value);
  if (!u) return err.textContent = "Benutzer nicht gefunden.";
  const h = await hashPw($("#uPw").value, u.salt);
  if (h !== u.hash) { err.textContent = "Passwort stimmt nicht."; $("#uPw").value = ""; $("#uPw").focus(); return; }
  await loginAs(u.id, $("#uStay").checked);
});
async function loginAs(id, stay) {
  state.user = id;
  try {
    const payload = JSON.stringify({ user: id, at: Date.now() });
    sessionStorage.setItem(SESSION_KEY, payload);
    if (stay) localStorage.setItem(SESSION_KEY, payload); else localStorage.removeItem(SESSION_KEY);
  } catch (e) {}
  gate.hidden = true; $("#app").hidden = false;
  applyRole();
  renderBrand(); renderList(); renderEditor(); renderPreview(true); updateSaveUI(); renderProvision();
}
function logout() {
  try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch (e) {}
  state.user = null; state.activeId = null;
  modal.classList.remove("open");
  showGate("login");
}
function applyRole() {
  const admin = isAdmin(), u = currentUser();
  $("#settingsBtn").style.display = admin ? "" : "none";
  $("#leadWrap").hidden = !admin;
  $("#exportBtn").style.display = admin ? "" : "";
  $("#who").innerHTML = u ? `<span>Angemeldet: <b>${esc(u.name)}</b></span><span class="role">${admin ? "Admin" : "Vertrieb"}</span><button class="btn ghost" id="logoutBtn">Abmelden</button>` : "";
}
document.addEventListener("click", e => { if (e.target.closest("#logoutBtn")) logout(); });

/* ---- Speicher-Status ---- */
function updateSaveUI() {
  const st = Store.statusText();
  const lbl = $("#saveState");
  if (lbl) { lbl.textContent = st.txt; lbl.className = "saved" + (st.tone === "ok" ? "" : " " + st.tone); }
  const line = $("#storeLine");
  if (line) {
    line.className = "storeline" + (st.tone === "ok" ? "" : " " + st.tone);
    line.innerHTML = `<i></i><span>${esc(st.txt)}</span>` +
      (Store.handle ? ` <button type="button" data-store="disconnect">trennen</button>` : "");
  }
  const fb = $("#fileBtn");
  if (fb) fb.textContent = Store.handle ? "💾 Andere Daten-Datei wählen" : "💾 Daten-Datei verbinden";
  const b = $("#banner");
  if (!b) return;
  if (Store.handle && Store.fileError === "prompt") {
    b.hidden = false; b.className = "banner warn";
    b.innerHTML = `<span><b>Daten-Datei ist verbunden.</b> Chrome braucht einmal pro Sitzung deine Bestätigung, damit automatisch gespeichert wird.</span><button class="btn primary" data-store="grant">Zugriff erlauben</button>`;
  } else if (!Store.can.ls && !Store.can.idb && !Store.handle) {
    b.hidden = false; b.className = "banner";
    b.innerHTML = `<span><b>Dieser Browser speichert hier nichts.</b> Öffne die Datei direkt in Chrome (Doppelklick) oder verbinde eine Daten-Datei – sonst sind deine Kunden nach dem Neuladen weg.</span>` +
      (Store.can.fsa ? `<button class="btn primary" data-store="connect">Daten-Datei verbinden</button>` : `<button class="btn primary" data-store="export">Backup jetzt sichern</button>`);
  } else b.hidden = true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-store]"); if (!b) return;
  const act = b.dataset.store;
  if (act === "connect") Store.connectFile();
  else if (act === "grant") Store.grantFile();
  else if (act === "disconnect") { if (confirm("Daten-Datei trennen? Gespeichert wird dann nur noch im Browser.")) Store.disconnectFile(); }
  else if (act === "export") $("#exportBtn").click();
});
$("#fileBtn").addEventListener("click", () => Store.connectFile());

/* ---- Init ---- */
(async () => {
  await Store.init();
  try {
    const d = await Store.loadBest();
    if (d) { applyData(d); state.activeId = d.activeId || null; Store.loadedAt = num(d.savedAt); }
  } catch (e) { toast("Gespeicherte Daten konnten nicht gelesen werden.", true); }
  if (state.activeId && !active()) state.activeId = null;
  if (state.settings.logoDunkel && !state.settings.logoHell && !state.settings.logoHellAuto) {
    try { state.settings.logoHell = await makeLightVariant(state.settings.logoDunkel); state.settings.logoHellAuto = true; } catch (e) {}
  }
  renderBrand();
  // Anmeldung: bestehende Sitzung fortsetzen, sonst Login bzw. Ersteinrichtung
  let sess = null;
  try { sess = JSON.parse(sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (!users().length) { showGate("setup"); }
  else if (sess && users().some(u => u.id === sess.user)) { state.user = sess.user; $("#app").hidden = false; applyRole(); }
  else { showGate("login"); }
  renderList(); renderEditor(); renderPreview(true); updateSaveUI(); renderProvision();
  // Direkt nach dem Start in alle verfügbaren Ebenen spiegeln, damit eine
  // geleerte Ebene (z. B. localStorage) sofort wieder aus einer anderen lebt.
  if (state.customers.length) Store.persist();
})();
</script>
